# T7 Display — hardware + layout policy
# Loaded by ~/.local/bin/t7-display (single authority).

# Outputs (hyprctl / DRM names)
T7_LAPTOP_OUTPUT=eDP-1
T7_EXTERNAL_OUTPUT=HDMI-A-1

# Layout geometry (scale 1 = native 1080p on this machine)
T7_DISPLAY_SCALE=1
T7_EXTERNAL_POS=0x0
T7_LAPTOP_POS_DUAL=1920x0
T7_LAPTOP_POS_SOLO=0x0

# Timing (seconds)
# Debounce after lid/HDMI/hypr events before applying
T7_DISPLAY_DEBOUNCE=0.55
# Fallback poll when no topology/monitor event arrives
T7_DISPLAY_POLL=1.0
# Minimum gap between two full enforces (protects Hyprland from spam)
T7_DISPLAY_MIN_APPLY_GAP=0.35
# Wait for bar layer after layout change before considering restart
T7_SHELL_WAIT=2.0
# Min seconds between Noctalia restarts
T7_SHELL_RESTART_GAP=12
# Idle polls between shell liveness checks (× POLL ≈ seconds)
T7_SHELL_IDLE_CHECKS=8
